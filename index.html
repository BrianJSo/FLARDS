<!DOCTYPE html>
<html>
<head>
  <title>FLARDS</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">
</head>

<body onload="loadApp()">

  <div class="panel main">

    <div class="card title">
      <h1 class="maintext">FLARDS</h1>
      <p class="subtext">a portmanteau for flash cards</p>
    </div>

    <div class="card score hide">
      <h1 class="maintext">Score</h1>
      <p class="subtext">is your score</p>
    </div>

    <div class="card prompt hide">
      <span class="counter">0/N</span>
      <p class="maintext">MainText</p>
      <p class="subtext">SubText</p>
    </div>

    <div class="answer hide">
      <input class="input" placeholder="answer here..." type="text">
      <button class="btn" onclick="answer()">ENTER</button>
    </div>

    <div class="reset hide">
      <button class="btn" onclick="restart()">RESTART</button>
    </div>

    <div class="menu">
      <textarea class="csv input" placeholder="enter your csv here" name="" id="">
        input your csv here
      </textarea>
      <div class="controls">
        <button class="btn start" onclick="loadCSV()">
          START
        </button>
        <button class="btn options" onclick="toggleOptions()">
          OPTIONS
        </button>
      </div>
    </div>

  </div>

  <div class="panel options hide">

    <div class="menu">
      <label class="switch subtextControl">
        <input type="checkbox" class="checkbox hide">
        <span class="slider round"></span>
      </label>
      <span class="toggleLabel">Hide subtext</span>
    </div>
    
    <button class="btn done" onclick="toggleOptions()">
      DONE
    </button>

  </div>

</body>
</html>
