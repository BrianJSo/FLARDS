<!DOCTYPE html>
<html>
<head>
  <title>FLARDS</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="script.js"></script>
</head>

<body onload="loadApp()">

  <div class="card title">
    <h1 class="maintext">FLARDS</h1>
    <p class="subtext">a portmanteau for flash cards</p>
  </div>

  <div class="card score hide">
    <h1 class="maintext">Score</h1>
    <p class="subtext">is your score</p>
  </div>

  <div class="card prompt hide">
    <span class="counter">0/N</span>
    <h1 class="maintext">MainText</h1>
    <p class="subtext">SubText</p>
  </div>

  <div class="answer hide">
    <input class="input" placeholder="answer here..." type="text">
    <button class="btn" onclick="answer()">ENTER</button>
  </div>

  <div class="csv">
    <textarea class="input" placeholder="enter your csv here" name="" id="">
      input your csv here
    </textarea>
    <div class="controls">
      <button class="btn" onclick="loadCSV()">
        START QUIZ
      </button>
      <div class="subtextControls">
        <label class="switch">
          <input type="checkbox" class="checkbox hide">
          <span class="slider round"></span>
        </label>
        <span class="toggleLabel">HIDE SUBTEXT</span>
      </div>
    </div>
  </div>

</body>
</html>
