<!DOCTYPE html>
<html>
<head>
  <title>FLARDS</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Long+Cang&family=Noto+Sans+SC:wght@100..900&family=Noto+Serif+SC:wght@200..900&family=Shippori+Antique&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>

<body onload="loadApp()">

  <div class="panel title">
    <div class="cardSpacer"></div>
    <div class="card title">
      <h1 class="maintext">FLARDS</h1>
      <p class="subtext">a portmanteau for flash cards</p>
    </div>

    <div class="main-menu">
      <textarea class="csv input" placeholder="enter your csv here" name="" id="">
        input your csv here
      </textarea>
      <div class="controls">
        <button class="btn start" onclick="loadCSV()">
          START
        </button>
        <button class="btn" onclick="toggleOptions()">
          OPTIONS
        </button>
      </div>
    </div>

  </div>

  <div class="panel main flip">
    <div class="cardSpacer"></div>
    <div class="card prompt">
      <span class="counter">0/N</span>
      <p class="maintext">MainText</p>
      <p class="subtext">SubText</p>
    </div>

    <div class="card correct flip">
      <p class="maintext">✓</p>
    </div>

    <div class="card wrong flip">
      <p class="maintext">ANSWER</p>
    </div>

    <div class="answer">
      <input class="input" placeholder="answer here..." type="text">
      <button class="btn" onclick="answer()">ENTER</button>
    </div>
  </div>


  <div class="panel score flip">
    <div class="cardSpacer"></div>
    <div class="card score">
      <h1 class="maintext">Score</h1>
      <p class="subtext">is your score</p>
    </div>

    <div class="reset">
      <button class="btn" onclick="restart()">RESTART</button>
    </div>
  </div>

  <div class="panel options flip">
    <div class="cardSpacer"></div>
    <div class="card sample">
      <textarea class="maintext" placeholder="Sample" name="" id="">MainText</textarea>
      <textarea class="subtext" placeholder="you can edit these texts" name="" id="">you can edit these texts</textarea>
    </div>

    <div class="menu">
      <div class="option fontSelector">
        <span class="label">Font:</span>
        <select class="fonts" onchange="setFont()" name="fonts" id="fonts">
          <option class="noto-serif-sc" value="noto-serif-sc">Noto Serif SC</option>
          <option class="noto-sans-sc" value="noto-sans-sc">Noto Sans SC</option>
          <option class="zcool-xiaowei" value="zcool-xiaowei">ZCOOL XiaoWei</option>
          <option class="long-cang" value="long-cang">Long Cang</option>
          <option class="kosugi-maru" value="kosugi-maru">Kosugi Maru</option>
          <option class="shippori-antique" value="shippori-antique">Shippori Antique</option>
        </select>
      </div>
      
      <div class="option">
        <span class="label">Hide subtext:</span>
        <label class="switch subtextControl">
          <input type="checkbox" onclick="toggleSubtext()" class="checkbox hide">
          <span class="slider round"></span>
        </label>
      </div>
      
      <button class="btn done" onclick="toggleOptions()">
        DONE
      </button>
    </div>
  </div>

</body>
</html>
